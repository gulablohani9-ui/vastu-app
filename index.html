<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vastu Plot Analyzer - Sai Lohani</title>
    <!-- Sirf jsPDF library ka use karenge (Fast & Lightweight) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        .screen { display: none; padding: 10px; text-align: center; }
        .active { display: block; }
        
        .canvas-container { width: 98vw; height: 98vw; max-width: 800px; max-height: 800px; margin: 10px auto; position: relative; border: 2px solid #4caf50; background: #1a1a1a; border-radius: 8px; }
        canvas.view-canvas { width: 100%; height: 100%; display: block; touch-action: none; background: transparent; }
        
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; }
        input[type="number"] { width: 100px; text-align: center; font-size: 18px; }
        button { background: #4caf50; color: white; cursor: pointer; }
        button:hover { background: #45a049; }
        .nav-buttons { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        
        .controls-card { background: #2c2c2c; padding: 12px; margin: 10px auto; border-radius: 10px; max-width: 95vw; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .controls-card label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; color: #ffeb3b; font-weight: bold; }
        .controls-card input[type="range"] { width: 100%; margin-bottom: 12px; height: 8px; background: #555; outline: none; border-radius: 5px; }
        
        .top-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .file-upload-btn { background: #2196F3; flex: 1; min-width: 140px; }
        .fullscreen-btn { background: #673ab7; flex: 1; min-width: 140px; }
        
        #preview-box { margin-top: 20px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Screen 1: Plot Setup -->
    <div id="screen1" class="screen active">
        <h2 style="margin-top: 5px;">1. Plot & Map Setup</h2>
        <div class="top-actions">
            <input type="file" id="mapUpload" accept="image/*" style="display:none;" onchange="loadMap(event)">
            <button class="file-upload-btn" onclick="document.getElementById('mapUpload').click()">🖼️ Upload Map</button>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">📱 Full Screen</button>
        </div>
        <p style="font-size: 14px; margin: 5px; color:#aaa;">Tap to place point. Drag to adjust.</p>
        
        <div style="margin: 10px 0;">
            <label style="font-size: 18px; font-weight: bold;">Plot Degree: </label>
            <input type="number" id="plotDegree" placeholder="Deg" value="0" oninput="setDegree(this.value)">
        </div>
        <div class="canvas-container"><canvas id="canvas1" class="view-canvas"></canvas></div>
        
        <div class="nav-buttons">
            <button onclick="undoPoint()" style="background:#e91e63;">↩ Undo Dot</button>
            <button onclick="clearPoints()" style="background:#f44336;">🗑️ Clear All</button>
            <button onclick="nextScreen(2)" style="background:#4caf50;">Next: Chakra 1 ➡</button>
        </div>
    </div>

    <!-- Screen 2: Chakra 1 -->
    <div id="screen2" class="screen">
        <h2>2. Vastu Chakra 1</h2>
        <div class="controls-card">
            <label><span>🔍 Chakra Size:</span></label>
            <input type="range" min="0.2" max="5" step="0.1" value="1" oninput="updateScale(1, this.value)">
            <label><span>🔄 Rotate Chakra:</span> <span id="degVal2">0°</span></label>
            <input type="range" id="degSlider2" min="0" max="360" step="1" value="0" oninput="setDegree(this.value)">
        </div>
        <div class="canvas-container"><canvas id="canvas2" class="view-canvas"></canvas></div>
        <div class="nav-buttons"><button onclick="nextScreen(1)">⬅ Back</button><button onclick="nextScreen(3)">Next ➡</button></div>
    </div>

    <!-- Screen 3: Chakra 2 -->
    <div id="screen3" class="screen">
        <h2>3. Vastu Chakra 2</h2>
        <div class="controls-card">
            <label><span>🔍 Chakra Size:</span></label>
            <input type="range" min="0.2" max="5" step="0.1" value="1" oninput="updateScale(2, this.value)">
            <label><span>🔄 Rotate Chakra:</span> <span id="degVal3">0°</span></label>
            <input type="range" id="degSlider3" min="0" max="360" step="1" value="0" oninput="setDegree(this.value)">
        </div>
        <div class="canvas-container"><canvas id="canvas3" class="view-canvas"></canvas></div>
        <div class="nav-buttons"><button onclick="nextScreen(2)">⬅ Back</button><button onclick="nextScreen(4)">Next ➡</button></div>
    </div>

    <!-- Screen 4: Chakra 3 -->
    <div id="screen4" class="screen">
        <h2>4. Vastu Chakra 3</h2>
        <div class="controls-card">
            <label><span>🔍 Chakra Size:</span></label>
            <input type="range" min="0.2" max="5" step="0.1" value="1" oninput="updateScale(3, this.value)">
            <label><span>🔄 Rotate Chakra:</span> <span id="degVal4">0°</span></label>
            <input type="range" id="degSlider4" min="0" max="360" step="1" value="0" oninput="setDegree(this.value)">
        </div>
        <div class="canvas-container"><canvas id="canvas4" class="view-canvas"></canvas></div>
        <div class="nav-buttons"><button onclick="nextScreen(3)">⬅ Back</button><button onclick="nextScreen(5)">Next ➡</button></div>
    </div>

    <!-- Screen 5: 45 Devtas -->
    <div id="screen5" class="screen">
        <h2>5. 45 Vastu Devtas</h2>
        <div class="controls-card">
            <label><span>🔍 Chakra Size:</span></label>
            <input type="range" min="0.2" max="5" step="0.1" value="1" oninput="updateScale(4, this.value)">
            <label><span>🔄 Rotate Chakra:</span> <span id="degVal5">0°</span></label>
            <input type="range" id="degSlider5" min="0" max="360" step="1" value="0" oninput="setDegree(this.value)">
        </div>
        <div class="canvas-container"><canvas id="canvas5" class="view-canvas"></canvas></div>
        <div class="nav-buttons"><button onclick="nextScreen(4)">⬅ Back</button><button onclick="nextScreen(6)">Final PDF ➡</button></div>
    </div>

    <!-- Screen 6: Final Generation -->
    <div id="screen6" class="screen">
        <h2>6. Final Report</h2>
        <div id="preview-box">
            <p>✔️ Maps are ready!</p>
            <p>Click below to download or share the HD PDF.</p>
        </div>

        <div class="nav-buttons" style="flex-direction: column; align-items: center; margin-top:30px;">
            <button onclick="downloadAndSharePDF()" style="background: #ff5722; padding: 15px 30px; font-size: 20px; width: 100%; max-width: 300px;">📥 Download / Share PDF</button>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="nextScreen(5)">⬅ Back</button>
                <button onclick="nextScreen(1)" style="background: #607d8b;">Start Over</button>
            </div>
        </div>
    </div>

<script>
    let currentScreen = 1;
    let points = [];
    let degree = 0;
    let mapImage = null; 
    let draggingPointIndex = -1;
    const CANVAS_RES = 800; // Resolution thodi kam ki hai takki mobile hang na ho
    let chakraScales = [1, 1, 1, 1, 1]; 

    const chakraImages = [null, new Image(), new Image(), new Image(), new Image()];
    chakraImages[1].src = "1000079054.png";
    chakraImages[2].src = "1000071649.jpg"; 
    chakraImages[3].src = "1000071166.png";
    chakraImages[4].src = "1000071166.png"; 

    for(let i=1; i<=5; i++) {
        let c = document.getElementById('canvas'+i);
        if(c) { c.width = CANVAS_RES; c.height = CANVAS_RES; }
    }
    const c1 = document.getElementById('canvas1');

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen();
        }
    }

    function setDegree(val) {
        if (val === "") val = 0;
        degree = parseInt(val);
        document.getElementById('plotDegree').value = degree;
        for(let i=2; i<=5; i++) {
            let slider = document.getElementById('degSlider'+i);
            let text = document.getElementById('degVal'+i);
            if(slider && slider.value != degree) slider.value = degree;
            if(text) text.innerText = degree + "°";
        }
        if(currentScreen >= 1 && currentScreen <= 5) {
            renderCanvas('canvas'+currentScreen, currentScreen - 1);
        }
    }

    function loadMap(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            mapImage = new Image();
            mapImage.onload = function() { renderCanvas('canvas1', 0); }
            mapImage.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    function nextScreen(num) {
        document.getElementById('screen'+currentScreen).classList.remove('active');
        currentScreen = num;
        document.getElementById('screen'+currentScreen).classList.add('active');
        if (num >= 1 && num <= 5) renderCanvas('canvas'+num, num - 1);
    }

    function updateScale(chakraIndex, val) {
        chakraScales[chakraIndex] = parseFloat(val);
        renderCanvas('canvas' + (chakraIndex + 1), chakraIndex);
    }

    function getPointerPos(e, targetCanvas) {
        const rect = targetCanvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let scaleX = targetCanvas.width / rect.width;
        let scaleY = targetCanvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function handleStart(e) {
        if(currentScreen !== 1) return;
        e.preventDefault();
        const pos = getPointerPos(e, c1);
        draggingPointIndex = -1;
        for (let i = 0; i < points.length; i++) {
            const dx = pos.x - points[i].x; const dy = pos.y - points[i].y;
            if (Math.sqrt(dx * dx + dy * dy) < 80) { draggingPointIndex = i; break; }
        }
        if (draggingPointIndex === -1) { points.push({x: pos.x, y: pos.y}); draggingPointIndex = points.length - 1; }
        renderCanvas('canvas1', 0);
    }

    function handleMove(e) {
        if (currentScreen === 1 && draggingPointIndex !== -1) {
            e.preventDefault();
            points[draggingPointIndex] = getPointerPos(e, c1);
            renderCanvas('canvas1', 0);
        }
    }
    function handleEnd(e) { draggingPointIndex = -1; }
    
    c1.addEventListener('mousedown', handleStart); c1.addEventListener('mousemove', handleMove);
    c1.addEventListener('mouseup', handleEnd); c1.addEventListener('mouseleave', handleEnd);
    c1.addEventListener('touchstart', handleStart, {passive: false}); c1.addEventListener('touchmove', handleMove, {passive: false}); c1.addEventListener('touchend', handleEnd);

    function undoPoint() { points.pop(); renderCanvas('canvas1', 0); }
    function clearPoints() { points = []; renderCanvas('canvas1', 0); }

    function renderCanvas(canvasId, chakraIndex) {
        const cvs = document.getElementById(canvasId);
        if(!cvs) return;
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, CANVAS_RES, CANVAS_RES);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, CANVAS_RES, CANVAS_RES); // White background for PDF
        
        if (mapImage) { ctx.globalAlpha = 0.5; ctx.drawImage(mapImage, 0, 0, CANVAS_RES, CANVAS_RES); ctx.globalAlpha = 1.0; }

        let cx = 0, cy = 0;
        if(points.length > 0) {
            points.forEach(p => { cx += p.x; cy += p.y; });
            cx /= points.length; cy /= points.length;
        }

        if(chakraIndex > 0 && points.length >= 3) {
            let img = chakraImages[chakraIndex];
            if(img && img.complete) {
                let maxDist = 0;
                points.forEach(p => {
                    let d = Math.sqrt(Math.pow(p.x - cx, 2) + Math.pow(p.y - cy, 2));
                    if(d > maxDist) maxDist = d;
                });
                let cSize = maxDist * 2.5; 
                if(cSize < 200) cSize = 200; 
                let customScale = chakraScales[chakraIndex] || 1;
                cSize = cSize * customScale;

                ctx.save();
                ctx.translate(cx, cy); 
                ctx.rotate(degree * Math.PI / 180); 
                ctx.drawImage(img, -cSize/2, -cSize/2, cSize, cSize); 
                ctx.restore();
            }
        }

        if(points.length > 0) {
            ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 6; ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            if(points.length > 2) ctx.closePath(); ctx.stroke();

            points.forEach((p, i) => {
                ctx.fillStyle = '#ff5722'; ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.fill(); 
                ctx.fillStyle = '#000'; ctx.font = "bold 24px Arial"; ctx.fillText("P"+(i+1), p.x + 15, p.y - 15);
            });

            if (points.length >= 3) {
                ctx.fillStyle = '#00bcd4'; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI*2); ctx.fill();
                ctx.font = "bold 28px Arial"; ctx.fillText('Brahma Sthan', cx+20, cy);
            }
        }
    }

    // 🔥 LIGHTWEIGHT NATIVE PDF MAKER & SHARER
    async function downloadAndSharePDF() {
        const btn = document.querySelector('#screen6 button');
        btn.innerText = "⏳ Generating PDF...";
        
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const titles = ["Vastu Chakra 1", "Vastu Chakra 2", "Vastu Chakra 3", "45 Vastu Devtas"];

            for(let i=1; i<=4; i++) {
                if (i > 1) doc.addPage();
                
                // Add Text
                doc.setFontSize(22);
                doc.setTextColor(0, 0, 0);
                doc.text("VASTU PLOT ANALYSIS", 105, 20, { align: "center" });
                
                doc.setFontSize(12);
                doc.text("Consultant: Sai Lohani | Plot Degree: " + degree + "°", 105, 30, { align: "center" });
                doc.text("Contact: +91 XXXXXXXXXX", 105, 38, { align: "center" });
                
                doc.setTextColor(211, 47, 47);
                doc.setFontSize(18);
                doc.text(titles[i-1], 105, 55, { align: "center" });

                // Add Canvas Image Directly (Bypasses heavy DOM cloning)
                let cvs = document.getElementById('canvas'+(i+1));
                let imgData = cvs.toDataURL('image/jpeg', 0.8);
                
                // Draw 170x170mm image centered
                doc.addImage(imgData, 'JPEG', 20, 65, 170, 170);
                doc.setDrawColor(50, 50, 50);
                doc.setLineWidth(1);
                doc.rect(20, 65, 170, 170);

                doc.setTextColor(100, 100, 100);
                doc.setFontSize(10);
                doc.text("Page " + i + " of 4", 105, 280, { align: "center" });
            }

            // PDF ready ho gayi
            const pdfBlob = doc.output('blob');
            const fileName = 'Vastu_Report_Sai_Lohani.pdf';

            // 🔥 MOBILE NATIVE SHARE (WhatsApp, Email etc ke liye)
            if (navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], fileName, { type: 'application/pdf' })] })) {
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Vastu Report',
                        text: 'Here is the Vastu Plot Analysis Report.'
                    });
                    btn.innerText = "📥 Download / Share PDF";
                    return; // Share successful
                } catch (err) {
                    console.log("Share cancelled.");
                }
            }

            // Normal Download Logic (Agar Phone Share block kar de)
            const url = URL.createObjectURL(pdfBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            btn.innerText = "📥 Download / Share PDF";

        } catch (error) {
            alert("Error: " + error.message);
            btn.innerText = "📥 Download / Share PDF";
        }
    }
</script>
</body>
</html>
