<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vastu Plot Analyzer - Sai Lohani</title>
    <!-- jsPDF library for 100% guaranteed PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        .screen { display: none; padding: 10px; text-align: center; }
        .active { display: block; }
        
        .canvas-container { width: 95vw; height: 95vw; max-width: 500px; max-height: 500px; margin: 10px auto; position: relative; border: 2px dashed #4caf50; background: #222; }
        canvas.view-canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #000; }
        
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
        input[type="number"] { width: 80px; text-align: center; }
        button { background: #4caf50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .nav-buttons { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        
        /* PDF Preview Area */
        #pdfPreviewContainer { width: 100%; max-width: 600px; height: 400px; overflow-y: scroll; margin: 10px auto; border: 2px solid #fff; background: #e0e0e0; }
        #pdfCanvas { width: 100%; height: auto; display: block; background: #fff; }
        
        .file-upload-btn { background: #2196F3; width: 100%; max-width: 300px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Screen 1: Plot Setup -->
    <div id="screen1" class="screen active">
        <h2>1. Plot & Degree Setup</h2>
        <input type="file" id="mapUpload" accept="image/*" style="display:none;" onchange="loadMap(event)">
        <button class="file-upload-btn" onclick="document.getElementById('mapUpload').click()">🖼️ Upload Map from Gallery</button>
        <p style="font-size: 14px;">Tap to add dot. Drag to move.</p>
        
        <div>
            <label>Plot Degree:</label>
            <input type="number" id="plotDegree" placeholder="Deg" value="0" onchange="updateDegree()">
        </div>
        
        <div class="canvas-container">
            <canvas id="canvas1" class="view-canvas"></canvas>
        </div>
        
        <div class="nav-buttons">
            <button onclick="undoPoint()">Undo Dot</button>
            <button onclick="clearPoints()">Clear All</button>
            <button onclick="nextScreen(2)">Next: Chakra 1</button>
        </div>
    </div>

    <!-- Screen 2: Chakra 1 -->
    <div id="screen2" class="screen">
        <h2>2. Vastu Chakra 1</h2>
        <div class="canvas-container"><canvas id="canvas2" class="view-canvas"></canvas></div>
        <div class="nav-buttons">
            <button onclick="nextScreen(1)">Back</button>
            <button onclick="nextScreen(3)">Next</button>
        </div>
    </div>

    <!-- Screen 3: Chakra 2 -->
    <div id="screen3" class="screen">
        <h2>3. Vastu Chakra 2</h2>
        <div class="canvas-container"><canvas id="canvas3" class="view-canvas"></canvas></div>
        <div class="nav-buttons">
            <button onclick="nextScreen(2)">Back</button>
            <button onclick="nextScreen(4)">Next</button>
        </div>
    </div>

    <!-- Screen 4: Chakra 3 -->
    <div id="screen4" class="screen">
        <h2>4. Vastu Chakra 3</h2>
        <div class="canvas-container"><canvas id="canvas4" class="view-canvas"></canvas></div>
        <div class="nav-buttons">
            <button onclick="nextScreen(3)">Back</button>
            <button onclick="nextScreen(5)">Next</button>
        </div>
    </div>

    <!-- Screen 5: 45 Devtas -->
    <div id="screen5" class="screen">
        <h2>5. 45 Vastu Devtas</h2>
        <div class="canvas-container"><canvas id="canvas5" class="view-canvas"></canvas></div>
        <div class="nav-buttons">
            <button onclick="nextScreen(4)">Back</button>
            <button onclick="nextScreen(6)">Next: PDF Preview</button>
        </div>
    </div>

    <!-- Screen 6: Final & PDF -->
    <div id="screen6" class="screen">
        <h2>6. Final Report Preview</h2>
        <p style="font-size: 14px; color:#aaa;">Scroll down to see the full A4 page preview.</p>
        
        <!-- A4 Size PDF Preview Canvas -->
        <div id="pdfPreviewContainer">
            <canvas id="pdfCanvas" width="1190" height="1684"></canvas>
        </div>

        <div class="nav-buttons">
            <button onclick="nextScreen(5)">Back</button>
            <button onclick="downloadPDF()" style="background: #ff5722;">💾 Download HD PDF</button>
            <button onclick="nextScreen(1)">Start Over</button>
        </div>
    </div>

<script>
    let currentScreen = 1;
    let points = [];
    let degree = 0;
    let mapImage = null; 
    let draggingPointIndex = -1;
    const CANVAS_RES = 1000; 

    // Pre-load all Chakra images here
    const chakraImages = [null, new Image(), new Image(), new Image(), new Image()];
    // MUST match your github filenames exactly
    chakraImages[1].src = "1000079054.png";
    chakraImages[2].src = "1000071649.jpg"; 
    chakraImages[3].src = "1000071166.png";
    chakraImages[4].src = "1000071166.png"; 

    // Initialize all normal canvases
    for(let i=1; i<=5; i++) {
        let c = document.getElementById('canvas'+i);
        if(c) { c.width = CANVAS_RES; c.height = CANVAS_RES; }
    }

    const c1 = document.getElementById('canvas1');

    function loadMap(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            mapImage = new Image();
            mapImage.onload = function() { renderCanvas('canvas1', 0); }
            mapImage.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    function nextScreen(num) {
        document.getElementById('screen'+currentScreen).classList.remove('active');
        currentScreen = num;
        document.getElementById('screen'+currentScreen).classList.add('active');
        
        if (num >= 1 && num <= 5) {
            renderCanvas('canvas'+num, num - 1);
        } else if (num === 6) {
            generatePDFPreview();
        }
    }

    function updateDegree() {
        degree = document.getElementById('plotDegree').value || 0;
        if(currentScreen >= 1 && currentScreen <= 5) {
            renderCanvas('canvas'+currentScreen, currentScreen - 1);
        }
    }

    // Touch & Mouse Logic on Screen 1
    function getPointerPos(e, targetCanvas) {
        const rect = targetCanvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let scaleX = targetCanvas.width / rect.width;
        let scaleY = targetCanvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function handleStart(e) {
        if(currentScreen !== 1) return;
        e.preventDefault();
        const pos = getPointerPos(e, c1);
        draggingPointIndex = -1;
        for (let i = 0; i < points.length; i++) {
            const dx = pos.x - points[i].x; const dy = pos.y - points[i].y;
            if (Math.sqrt(dx * dx + dy * dy) < 80) { draggingPointIndex = i; break; }
        }
        if (draggingPointIndex === -1) {
            points.push({x: pos.x, y: pos.y});
            draggingPointIndex = points.length - 1;
        }
        renderCanvas('canvas1', 0);
    }

    function handleMove(e) {
        if (currentScreen === 1 && draggingPointIndex !== -1) {
            e.preventDefault();
            points[draggingPointIndex] = getPointerPos(e, c1);
            renderCanvas('canvas1', 0);
        }
    }

    function handleEnd(e) { draggingPointIndex = -1; }

    c1.addEventListener('mousedown', handleStart); c1.addEventListener('mousemove', handleMove);
    c1.addEventListener('mouseup', handleEnd); c1.addEventListener('mouseleave', handleEnd);
    c1.addEventListener('touchstart', handleStart, {passive: false});
    c1.addEventListener('touchmove', handleMove, {passive: false});
    c1.addEventListener('touchend', handleEnd);

    function undoPoint() { points.pop(); renderCanvas('canvas1', 0); }
    function clearPoints() { points = []; renderCanvas('canvas1', 0); }

    // THE MASTER DRAWING FUNCTION
    function renderCanvas(canvasId, chakraIndex) {
        const cvs = document.getElementById(canvasId);
        if(!cvs) return;
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, CANVAS_RES, CANVAS_RES);
        
        // 1. Draw Map Base
        if (mapImage) {
            ctx.globalAlpha = 0.5;
            ctx.drawImage(mapImage, 0, 0, CANVAS_RES, CANVAS_RES);
            ctx.globalAlpha = 1.0;
        }

        // Calculate Center (Brahma Sthan)
        let cx = 0, cy = 0;
        if(points.length > 0) {
            points.forEach(p => { cx += p.x; cy += p.y; });
            cx /= points.length; cy /= points.length;
        }

        // 2. Draw Chakra exactly on Center Point
        if(chakraIndex > 0 && points.length >= 3) {
            let img = chakraImages[chakraIndex];
            if(img && img.complete) {
                // Find radius to cover the plot
                let maxDist = 0;
                points.forEach(p => {
                    let d = Math.sqrt(Math.pow(p.x - cx, 2) + Math.pow(p.y - cy, 2));
                    if(d > maxDist) maxDist = d;
                });
                let cSize = maxDist * 2.2; // Padding
                if(cSize < 400) cSize = 400; // Minimum size

                ctx.save();
                ctx.translate(cx, cy); // Move context to Brahma Sthan
                ctx.rotate(degree * Math.PI / 180); // Rotate by User Degree
                ctx.drawImage(img, -cSize/2, -cSize/2, cSize, cSize); // Draw centered
                ctx.restore();
            }
        }

        // 3. Draw Lines and Dots
        if(points.length > 0) {
            ctx.strokeStyle = '#4caf50';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            if(points.length > 2) ctx.closePath();
            ctx.stroke();

            points.forEach((p, i) => {
                ctx.fillStyle = '#ff5722';
                ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.fill(); 
                ctx.fillStyle = '#fff'; ctx.font = "bold 24px Arial";
                ctx.fillText("P"+(i+1), p.x + 15, p.y - 15);
            });

            if (points.length >= 3) {
                ctx.fillStyle = '#00bcd4';
                ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI*2); ctx.fill();
                ctx.font = "bold 28px Arial";
                ctx.fillText('Brahma Sthan', cx+20, cy);
            }
        }
    }

    // A4 PDF Preview Generation
    function generatePDFPreview() {
        const pdfCv = document.getElementById('pdfCanvas');
        const pCtx = pdfCv.getContext('2d');
        
        // White Background
        pCtx.fillStyle = '#ffffff';
        pCtx.fillRect(0, 0, pdfCv.width, pdfCv.height);
        
        // Header Text
        pCtx.fillStyle = '#000000';
        pCtx.font = "bold 45px Arial"; pCtx.textAlign = "center";
        pCtx.fillText("VASTU PLOT ANALYSIS", pdfCv.width/2, 80);
        
        pCtx.font = "30px Arial";
        pCtx.fillText("Consultant: Sai Lohani  |  Plot Degree: " + degree + "°", pdfCv.width/2, 130);
        pCtx.fillText("Contact: +91 XXXXXXXXXX", pdfCv.width/2, 175);
        
        // Draw the 4 canvases into a 2x2 Grid on A4
        const w = 500, h = 500; 
        const marginX = 60, marginY = 250;
        const gapX = 70, gapY = 150;
        
        const positions = [
            {x: marginX, y: marginY, title: "Chakra 1"},
            {x: marginX + w + gapX, y: marginY, title: "Chakra 2"},
            {x: marginX, y: marginY + h + gapY, title: "Chakra 3"},
            {x: marginX + w + gapX, y: marginY + h + gapY, title: "45 Devtas"}
        ];

        for(let i=1; i<=4; i++) {
            let sourceCanvas = document.getElementById('canvas'+(i+1));
            let pos = positions[i-1];
            
            // Draw Title
            pCtx.fillStyle = '#d32f2f'; pCtx.font = "bold 35px Arial"; pCtx.textAlign = "center";
            pCtx.fillText(pos.title, pos.x + w/2, pos.y - 20);
            
            // Draw Canvas Image
            pCtx.drawImage(sourceCanvas, pos.x, pos.y, w, h);
            
            // Draw Border
            pCtx.strokeStyle = "#333"; pCtx.lineWidth = 3;
            pCtx.strokeRect(pos.x, pos.y, w, h);
        }
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const pdfCanvas = document.getElementById('pdfCanvas');
        
        // Convert the preview canvas directly to a high-quality JPEG
        const imgData = pdfCanvas.toDataURL('image/jpeg', 0.95);
        
        // Place it filling the A4 page (210x297 mm)
        doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
        doc.save('Vastu_Report_Sai_Lohani.pdf');
    }
</script>
</body>
</html>
